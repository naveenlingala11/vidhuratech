<ng-container *ngIf="isFullscreenPage(); else normalDashboard">
  <main class="fullscreen-main">
    <router-outlet></router-outlet>
  </main>
</ng-container>

<ng-template #normalDashboard>
  <section class="dashboard-layout">
    <app-dashboard-topbar (menuToggle)="toggleSidebar()"></app-dashboard-topbar>

    <div class="dashboard-body">
      <div class="sidebar-overlay" *ngIf="mobile && sidebarOpen" (click)="closeSidebar()"></div>

      <app-dashboard-sidebar
        [collapsed]="!sidebarOpen"
        [mobile]="mobile"
        (menuToggle)="toggleSidebar()"
      ></app-dashboard-sidebar>

      <main class="dashboard-main" [class.sidebar-collapsed]="!sidebarOpen && !mobile">
        <div class="dashboard-content" (click)="closeSidebar()">
          <div class="page-surface">
            <router-outlet></router-outlet>
          </div>
        </div>
      </main>
    </div>
  </section>
</ng-template>
