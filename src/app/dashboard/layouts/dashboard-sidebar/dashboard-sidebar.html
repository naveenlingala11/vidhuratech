<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile]="mobile">
  <div class="sidebar-user" *ngIf="!collapsed">
    <img
      *ngIf="profileImageUrl; else sidebarInitials"
      class="avatar avatar-img"
      [src]="profileImageUrl"
      [alt]="user?.name || 'User'"
      referrerpolicy="no-referrer"
      (error)="onProfileImageError()"
    />

    <ng-template #sidebarInitials>
      <div class="avatar">{{ userInitials }}</div>
    </ng-template>

    <div class="sidebar-user-meta">
      <strong>{{ user?.name || 'User' }}</strong>
      <span>{{ user?.email || 'Vidhura Tech' }}</span>
      <span
        class="user-plan-badge"
        *ngIf="userPlanBadgeService.badge$ | async as planBadge"
        [ngClass]="planBadge.className"
      >
        <i [class]="planBadge.icon"></i>
        {{ planBadge.label }}
      </span>
    </div>
  </div>
  <label class="search-box" *ngIf="!collapsed">
    <i class="bi bi-search"></i>
    <input [(ngModel)]="searchText" type="text" placeholder="Search menu" />
    <button *ngIf="searchText" type="button" (click)="clearSearch()">
      <i class="bi bi-x"></i>
    </button>
  </label>

  <nav class="menu">
    <button
      type="button"
      class="menu-link"
      *ngFor="let item of filteredMenuItems"
      [class.active]="isActive(item.route)"
      [attr.title]="collapsed ? item.label : null"
      (click)="navigateTo(item)"
    >
      <i [class]="item.icon"></i>
      <span *ngIf="!collapsed">{{ item.label }}</span>
    </button>
  </nav>

  <div class="empty-menu" *ngIf="!collapsed && !filteredMenuItems.length">No menu found</div>

  <footer class="sidebar-footer">
    <button
      type="button"
      class="footer-btn"
      (click)="goHome()"
      [attr.title]="collapsed ? 'Home' : null"
    >
      <i class="bi bi-house"></i>
      <span *ngIf="!collapsed">Home</span>
    </button>

    <button
      type="button"
      class="footer-btn logout"
      (click)="logout()"
      [attr.title]="collapsed ? 'Logout' : null"
    >
      <i class="bi bi-box-arrow-right"></i>
      <span *ngIf="!collapsed">Logout</span>
    </button>

    <div class="footer-note" *ngIf="!collapsed">© {{ currentYear }} Vidhura Tech</div>
  </footer>
</aside>
