<div class="chat-container">
  <div class="chat-card">
    <!-- Chat Header -->
    <div class="chat-header">
      <button class="back-btn" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back
      </button>

      <div class="user-info" *ngIf="!loading">
        <div class="avatar-circle">
          {{ recipientAvatar }}
        </div>
        <div class="meta">
          <h3>{{ recipientName }}</h3>
          <span class="role-badge">{{ recipientRole }}</span>
        </div>
      </div>
    </div>

    <!-- Chat Messages Body -->
    <div class="chat-body" #scrollContainer>
      <div class="loading-overlay" *ngIf="loading">
        <div class="spinner"></div>
        <p>Loading messages...</p>
      </div>

      <div class="empty-chat" *ngIf="!loading && messages.length === 0">
        <div class="chat-icon-large">💬</div>
        <h3>Start the conversation</h3>
        <p>Send a message to clarify doubts, ask questions, or reschedule sessions.</p>
      </div>

      <div class="message-list" *ngIf="!loading && messages.length > 0">
        <div class="message-wrapper" *ngFor="let msg of messages" [ngClass]="{'outgoing': isMyMessage(msg), 'incoming': !isMyMessage(msg)}">
          <div class="message-bubble">
            <div class="sender-name" *ngIf="!isMyMessage(msg)">{{ msg.senderName }}</div>
            <div class="message-text">{{ msg.messageText }}</div>
            <div class="message-time">{{ formatTime(msg.createdAt) }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Footer Input -->
    <form class="chat-footer" (ngSubmit)="sendMessage()" #chatForm="ngForm">
      <input 
        type="text" 
        name="message" 
        [(ngModel)]="newMessageText" 
        placeholder="Type a message..." 
        autocomplete="off"
        required
        [disabled]="sending"
      />
      <button type="submit" [disabled]="!newMessageText.trim() || sending">
        <span *ngIf="!sending">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </span>
        <span class="btn-spinner" *ngIf="sending"></span>
      </button>
    </form>
  </div>
</div>
